[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "body-soft-sensor"
version = "0.3.0"
description = "A reproducible feasibility study for body-composition soft sensing with NHANES data."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116",
    "joblib>=1.4",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pyarrow>=18",
    "scikit-learn==1.9.1",
    "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8"]

[project.scripts]
body-soft-sensor = "body_soft_sensor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
body_soft_sensor = ["static/*"]

